
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rajan AI Translator</title>
  <link rel="stylesheet" href="style.css"> 
  <meta name="google-site-verification" content="cTXCyAv3B-OvpwFwfPo2ctsJIH8BjrrYIATJHtusMnI" />
</head>
<body>

  <div class="container">
    <h1>🌐 Rajan AI Translator</h1>
    <p class="subtitle">Translate any language instantly</p>

    <div class="language-box">
      <div>
        <label for="fromLang">From Language</label>
        <select id="fromLang">
          <option value="hi">Hindi</option>
          <option value="en">English</option>
          <option value="pa">Punjabi</option>
          <option value="ur">Urdu</option>
          <option value="bn">Bengali</option>
          <option value="gu">Gujarati</option>
          <option value="mr">Marathi</option>
          <option value="ta">Tamil</option>
          <option value="te">Telugu</option>
          <option value="ar">Arabic</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="it">Italian</option>
          <option value="pt">Portuguese</option>
          <option value="ru">Russian</option>
          <option value="ja">Japanese</option>
          <option value="zh">Chinese</option>
          <option value="ko">Korean</option>
          <option value="ne">Nepali</option>
          <option value="si">Sinhala</option>
          <option value="th">Thai</option>
          <option value="vi">Vietnamese</option>
          <option value="tr">Turkish</option>
          <option value="fa">Persian</option>
          <option value="id">Indonesian</option>
          <option value="ms">Malay</option>
          <option value="nl">Dutch</option>
          <option value="pl">Polish</option>
          <option value="uk">Ukrainian</option>
          <option value="el">Greek</option>
          <option value="he">Hebrew</option>
          <option value="sw">Swahili</option>
        </select>
      </div>

      <button id="swapBtn" type="button">⇄</button>

      <div>
        <label for="toLang">To Language</label>
        <select id="toLang">
          <option value="en">English</option>
          <option value="hi">Hindi</option>
          <option value="pa">Punjabi</option>
          <option value="ur">Urdu</option>
          <option value="bn">Bengali</option>
          <option value="gu">Gujarati</option>
          <option value="mr">Marathi</option>
          <option value="ta">Tamil</option>
          <option value="te">Telugu</option>
          <option value="ar">Arabic</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="it">Italian</option>
          <option value="pt">Portuguese</option>
          <option value="ru">Russian</option>
          <option value="ja">Japanese</option>
          <option value="zh">Chinese</option>
          <option value="ko">Korean</option>
          <option value="ne">Nepali</option>
          <option value="si">Sinhala</option>
          <option value="th">Thai</option>
          <option value="vi">Vietnamese</option>
          <option value="tr">Turkish</option>
          <option value="fa">Persian</option>
          <option value="id">Indonesian</option>
          <option value="ms">Malay</option>
          <option value="nl">Dutch</option>
          <option value="pl">Polish</option>
          <option value="uk">Ukrainian</option>
          <option value="el">Greek</option>
          <option value="he">Hebrew</option>
          <option value="sw">Swahili</option>
        </select>
      </div>
    </div>

    <div class="voice-box">
      <button id="voiceBtn" type="button">🎤 Speak</button>
      <span id="voiceStatus"></span>
    </div>

    <label for="inputText">Enter Your Text</label>
    <textarea id="inputText" placeholder="Type or speak here..."></textarea>

    <button id="translateBtn" class="main-btn" type="button">
      🌐 Translate
    </button>

    <label for="outputText">Translated Text</label>
    <textarea id="outputText" placeholder="Translation will appear here..." readonly></textarea>

    <div class="action-buttons">
      <button id="speakBtn" type="button">🔊 Listen</button>
      <button id="copyBtn" type="button">📋 Copy</button>
      <button id="clearBtn" type="button">🗑 Clear</button>
    </div>

    <p id="status" role="status">Ready to translate!</p>

    <footer>Made with ❤️ by Rajan</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
